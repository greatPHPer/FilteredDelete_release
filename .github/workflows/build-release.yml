name: Build and publish FilteredDelete

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source branch or tag to build (for example main or v1.0.0)
        required: true
        type: string
        default: main
      release_tag:
        description: Public release version tag (for example v1.0.0)
        required: true
        type: string
        default: v1.0.0
      publish_release:
        description: Publish a GitHub release after every platform build and test passes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_VERSION: ${{ inputs.publish_release && inputs.release_tag || inputs.source_ref }}
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: greatPHPer/FilteredDelete
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Validate release version
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$PUBLISH_RELEASE" == "true" && ! "$RELEASE_TAG" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "Release tag must use semantic version format such as v1.0.0."
            exit 1
          fi

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore source/FilteredDelete.sln

      - name: Build
        run: dotnet build source/FilteredDelete.sln -c Release --no-restore

      - name: Test
        run: dotnet test source/FilteredDelete.sln -c Release --no-build --verbosity normal

      - name: Publish self-contained application
        run: dotnet publish source/src/FilteredDelete.Desktop/FilteredDelete.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish

      - name: Package Windows build
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "FilteredDelete-${{ matrix.rid }}-$env:PACKAGE_VERSION.zip"

      - name: Package Linux build
        if: startsWith(matrix.rid, 'linux-')
        run: tar -czf "FilteredDelete-${{ matrix.rid }}-$PACKAGE_VERSION.tar.gz" -C publish .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: FilteredDelete-${{ matrix.rid }}
          path: FilteredDelete-${{ matrix.rid }}-${{ env.PACKAGE_VERSION }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    if: ${{ inputs.publish_release }}
    name: Publish public release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: FilteredDelete ${{ inputs.release_tag }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
